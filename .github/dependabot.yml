version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Both are pinned to what one Home Assistant release requires; bump them together.
      - dependency-name: pytest-homeassistant-custom-component
      - dependency-name: home-assistant-frontend

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
